[workspace]
resolver = "2"
members = ["crates/office-core", "crates/office-hook", "crates/office"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1"
dirs = "5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
